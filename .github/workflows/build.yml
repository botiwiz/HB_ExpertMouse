name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the in-box csc.exe
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: HB_ExpertMouse
          path: HB_ExpertMouse.exe

  linux-appimage:
    # oldest supported runner -> AppImage runs on distros with older glibc too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Build AppImage
        run: linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HB_ExpertMouse-AppImage
          path: linux/HB_ExpertMouse-x86_64.AppImage
